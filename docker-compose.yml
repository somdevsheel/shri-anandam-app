name: shri-anandam

services:
  postgres:
    image: postgres:16-alpine
    container_name: shri-anandam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shri_anandam
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: shri_anandam_dev
    ports:
      # Host port 55433 (5432 is commonly taken by other local projects) ->
      # keep DATABASE_URL in .env in sync if you change this.
      - "127.0.0.1:55433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shri_anandam -d shri_anandam_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - shri-anandam-net

  redis:
    image: redis:7-alpine
    container_name: shri-anandam-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Host port 6381 (6379 is commonly taken by other local projects) ->
      # keep REDIS_URL in .env in sync if you change this.
      - "127.0.0.1:6381:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - shri-anandam-net

  # Local S3-compatible storage for development only.
  minio:
    image: minio/minio:latest
    container_name: shri-anandam-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: shri_anandam
      MINIO_ROOT_PASSWORD: changeme123
    ports:
      - "127.0.0.1:9020:9000"
      - "127.0.0.1:9021:9001"
    volumes:
      - miniodata:/data
    networks:
      - shri-anandam-net

networks:
  shri-anandam-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
