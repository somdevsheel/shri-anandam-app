# Nginx reverse-proxy config for the Shri Anandam platform's 3 web-facing
# subdomains — see docs/deployment/domain-and-dns.md for the full setup
# (DNS records, certbot invocation, why 3 subdomains).
#
# Not deployed anywhere by this repo — copy to
# /etc/nginx/sites-available/shri-anandam.conf on the Lightsail instance,
# symlink into sites-enabled, then run certbot (see the doc) to fill in
# the ssl_certificate lines this file starts without.
#
# Ports match each app's own package.json (services/api's APP_PORT=4000
# from .env, apps/admin-web's default 3000, apps/kitchen-web's explicit
# `-p 3001` — see apps/kitchen-web/package.json) and processes run
# app instances directly on localhost — Nginx never talks to anything
# but 127.0.0.1 here, matching this repo's own private-networking rule
# for every other backing service (docs/architecture/
# production-architecture.md's "Private networking" section).

# --- api.shrianandamsweets.in -> services/api (port 4000) ---
server {
    listen 80;
    server_name api.shrianandamsweets.in;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Socket.IO (services/api/src/realtime/realtime.gateway.ts) shares
        # this same origin/port — no separate location block is needed for
        # its default /socket.io/ path EXCEPT for the WebSocket upgrade
        # headers, which every request here gets so a plain REST call isn't
        # affected by them being present.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Realtime connections are long-lived — don't let Nginx's default
        # 60s proxy_read_timeout silently drop an idle-but-open socket.
        proxy_read_timeout 3600s;
    }
}

# --- admin.shrianandamsweets.in -> apps/admin-web (port 3000) ---
server {
    listen 80;
    server_name admin.shrianandamsweets.in;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# --- kitchen.shrianandamsweets.in -> apps/kitchen-web (port 3001) ---
server {
    listen 80;
    server_name kitchen.shrianandamsweets.in;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# NOTE: no server block for shrianandamsweets.in or www.shrianandamsweets.in
# here on purpose — the existing main website is untouched by this file and
# keeps whatever web server config it already has. This file only adds the
# 3 new subdomains above.
